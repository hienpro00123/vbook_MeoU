name: Validate Extensions & Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Verify VBook Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify Catalog Alignment & ZIP Integrity
        run: node tools/cli/index.js verify

      - name: Validate All Extensions for Rhino ES6 Safe Mode
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { handleValidateCommand } = require("./tools/cli/commands/validate");

            async function runAll() {
              const baseDir = path.resolve("extensions");
              const cats = fs.readdirSync(baseDir).filter(f => fs.statSync(path.join(baseDir, f)).isDirectory());
              let hasError = false;

              for (const cat of cats) {
                const catDir = path.join(baseDir, cat);
                const items = fs.readdirSync(catDir).filter(f => fs.statSync(path.join(catDir, f)).isDirectory());
                for (const item of items) {
                  const extPath = `extensions/${cat}/${item}`;
                  const pJson = path.join(extPath, "plugin.json");
                  if (!fs.existsSync(pJson)) continue;
                  
                  const p = JSON.parse(fs.readFileSync(pJson, "utf8"));
                  if (p.metadata && p.metadata.encrypt) {
                    console.log(`\nSkipping encrypted extension: ${extPath}`);
                    continue;
                  }

                  const ok = await handleValidateCommand({ plugin: extPath }, process.cwd());
                  if (!ok) hasError = true;
                }
              }

              if (hasError) {
                console.error("\n[ERROR] Some extensions failed validation.");
                process.exit(1);
              } else {
                console.log("\n[SUCCESS] All extensions passed Rhino ES6 validation.");
              }
            }

            runAll().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
